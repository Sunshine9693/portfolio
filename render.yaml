# Render Blueprint for the portfolio backend.
# Deploy from the Render Dashboard: New -> Blueprint -> select this repository.
# Values marked "sync: false" are requested during the initial deploy.
services:
  - type: web
    name: portfolio-api
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      # Comma-separated list; "*" matches Vercel preview deployment URLs.
      - key: CLIENT_URL
        value: https://sanafatma-portfolio.vercel.app,https://portfolio-ivory-tau-82.vercel.app,https://portfolio-*.vercel.app
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_SETUP_TOKEN
        sync: false
      # Optional live AI provider (OpenRouter).
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini

    # Uploaded media is stored in MongoDB GridFS; a persistent disk is not needed.
